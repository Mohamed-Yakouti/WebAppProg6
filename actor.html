<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actor Guess Game</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

    <div class="container bg-white p-4 rounded shadow-sm" style="max-width: 600px;">
        <h2 class="mb-4 text-primary">Actors by Mohamed El Yakouti</h2>

        <!-- Part 3: Actor Form -->
        <form class="mb-4">
            <div class="mb-3">
                <label for="secretActor" class="form-label">Peter Pan:</label>
                <input type="password" id="secretActor" class="form-control" value="Robin Williams">
            </div>

            <div class="mb-3">
                <label for="guessActor" class="form-label">Who is the actor:</label>
                <input type="text" id="guessActor" class="form-control" placeholder="Enter actor name">
            </div>

            <input type="button" id="checkBtn" class="btn btn-primary" onclick="checkActor()" value="Check the guess">
        </form>

        <!-- Result Display Div -->
        <div id="scoreDisplay" class="alert alert-info fw-bold">
            Correct: 0 | Not Correct: 0
        </div>

        <hr>

        <!-- Part 4: Image Rotator -->
        <h4 class="text-secondary mb-3">Food Gallery</h4>
        <div class="text-center">
            <img id="foodImg" src="food1.jpg" alt="Food Image" class="img-thumbnail" style="width: 150px; height: 150px; cursor: pointer;" onclick="updatePic()">
            <p class="text-muted mt-2"><small>Click the image to cycle through foods</small></p>
        </div>
    </div>

    <script>
        // Global variables for Actor Game
        var correct = 0;
        var notCorrect = 0;

        function checkActor() {
            var secret = document.getElementById("secretActor").value;
            var guess = document.getElementById("guessActor").value;

            if (guess.trim().toLowerCase() === secret.trim().toLowerCase()) {
                correct++;
                alert("That's right");
            } else {
                notCorrect++;
                alert("Better luck next time");
            }

            // Update display div
            document.getElementById("scoreDisplay").innerHTML = "Correct: " + correct + " | Not Correct: " + notCorrect;

            // Bonus Check: If wrong guesses exceed 10, replace onclick function
            if (notCorrect > 10) {
                document.getElementById("checkBtn").setAttribute("onclick", "tooManyGuesses()");
            }
        }

        // Bonus Function called after >10 wrong guesses
        function tooManyGuesses() {
            alert("Sorry, too many wrong guesses.");
        }

        // Global variable for Image Rotator
        var usePic = 1;

        function updatePic() {
            var imgElem = document.getElementById("foodImg");

            switch (usePic) {
                case 1:
                    imgElem.src = "food2.jpg";
                    usePic = 2;
                    break;
                case 2:
                    imgElem.src = "food3.jpg";
                    usePic = 3;
                    break;
                case 3:
                    imgElem.src = "food1.jpg";
                    usePic = 1;
                    break;
            }
        }
    </script>

</body>
</html>

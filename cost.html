<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Cost Computation</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light p-4">

    <div class="container bg-white p-4 rounded shadow-sm" style="max-width: 650px;">
        <h2 class="mb-4 text-primary text-center">EL YAKOUTI MOHAMED sales computation</h2>

        <!-- Part 5: Sales Computation Form -->
        <form class="mb-3">
            <div class="mb-3">
                <label for="numberItems" class="form-label">Enter number items:</label>
                <input type="number" id="numberItems" class="form-control" value="1">
            </div>

            <div class="mb-3">
                <label for="itemCost" class="form-label">Enter the cost of one item:</label>
                <input type="number" id="itemCost" class="form-control" value="20.0" step="0.1">
            </div>

            <div class="mb-3">
                <label for="numberForDiscount" class="form-label">Enter number to get discount:</label>
                <input type="number" id="numberForDiscount" class="form-control" value="10">
            </div>

            <div class="mb-3">
                <label for="DiscountRate" class="form-label">Enter the discount rate:</label>
                <input type="number" id="DiscountRate" class="form-control" value="0.15" step="0.01">
            </div>

            <input type="button" onclick="doDiscount()" class="btn btn-primary w-100" value="Show costs">
        </form>

        <!-- Result Display Div -->
        <div id="result" class="alert alert-info fw-bold mb-4">
            Costs will be displayed here
        </div>

        <hr class="my-4">

        <!-- Part 6: Radio Operations -->
        <h4 class="text-secondary mb-3">Radio Operations</h4>
        <form class="mb-3">
            <div class="form-check">
                <input class="form-check-input" type="radio" name="operation" id="op_mul" value="mul" onclick="chooseOp()">
                <label class="form-check-label" for="op_mul">product</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="operation" id="op_add" value="add" onclick="chooseOp()">
                <label class="form-check-label" for="op_add">sum</label>
            </div>
            <div class="form-check mb-3">
                <input class="form-check-input" type="radio" name="operation" id="op_div" value="div" onclick="chooseOp()">
                <label class="form-check-label" for="op_div">divide</label>
            </div>
        </form>

        <div id="opResult" class="alert alert-secondary fw-bold">
            Operation result will be displayed here
        </div>
    </div>

    <script>
        function doDiscount() {
            var number = Number(document.getElementById("numberItems").value);
            var cost = Number(document.getElementById("itemCost").value);
            var discountRate = Number(document.getElementById("DiscountRate").value);
            var discountAt = Number(document.getElementById("numberForDiscount").value);

            var costs = "";

            for (var i = 1; i <= 5; i++) {
                var checkCount = i * number;
                var totalCost;

                if (checkCount <= discountAt) {
                    totalCost = checkCount * cost;
                } else {
                    totalCost =
                        (discountAt * cost) +
                        ((checkCount - discountAt) * cost * (1 - discountRate));
                }

                costs = costs + "checkCount " + checkCount + " is " + totalCost + "; ";
            }

            document.getElementById("result").innerHTML = "Costs are: " + costs;
        }

        function chooseOp() {
            var count = Number(document.getElementById("numberItems").value);
            var discountAt = Number(document.getElementById("numberForDiscount").value);

            var operation = document.querySelector('input[name="operation"]:checked').value;
            var result;

            if (operation === "mul") {
                result = count * discountAt;
                document.getElementById("opResult").innerHTML = count + " times " + discountAt + " is " + result;
            } else if (operation === "add") {
                result = count + discountAt;
                document.getElementById("opResult").innerHTML = count + " plus " + discountAt + " is " + result;
            } else if (operation === "div") {
                result = count / discountAt;
                document.getElementById("opResult").innerHTML = count + " divided by " + discountAt + " is " + result;
            }
        }
    </script>

</body>
</html>

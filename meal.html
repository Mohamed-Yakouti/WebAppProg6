<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Planner</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

    <div class="container bg-white p-4 rounded shadow-sm" style="max-width: 650px;">
        <h2 class="mb-4 text-primary text-center">EL YAKOUTI MOHAMED meal planner</h2>

        <!-- Part 7: Checkbox Form -->
        <h4 class="text-secondary mb-3">Meal Selection</h4>
        <form class="mb-3">
            <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="cb_breakfast" value="True" checked>
                <label class="form-check-label" for="cb_breakfast">Breakfast</label>
            </div>

            <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" id="cb_lunch" value="False">
                <label class="form-check-label" for="cb_lunch">Lunch</label>
            </div>

            <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="cb_dinner" value="True" checked>
                <label class="form-check-label" for="cb_dinner">Dinner</label>
            </div>

            <input type="button" onclick="choices()" class="btn btn-primary w-100" value="Meal Plan Choices">
        </form>

        <hr class="my-4">

        <!-- Part 8: Cuisine and Beverage Form -->
        <h4 class="text-secondary mb-3">Cuisine & Beverage Options</h4>
        <form class="mb-3">
            <div class="mb-3">
                <label for="cuisine" class="form-label">Enter cuisine type:</label>
                <input type="text" id="cuisine" class="form-control" value="Italian">
            </div>

            <div class="mb-3">
                <label for="beverage" class="form-label">Enter beverage choice:</label>
                <input type="text" id="beverage" class="form-control" value="water">
            </div>

            <input type="button" onclick="updateMeal()" class="btn btn-success w-100" value="Update the meal plan">
        </form>

        <!-- Result Display Div -->
        <h5 class="mt-4">Meal Plan Result:</h5>
        <div id="mealResult" class="alert alert-info fw-bold">
            Meal plan will appear here.
        </div>
    </div>

    <script>
        // Part 7: Global Object Variable
        var my_meal_plan = {};

        // Part 7 Function
        function choices() {
            my_meal_plan = {}; // Reset object

            my_meal_plan.breakfast = document.getElementById("cb_breakfast").checked;
            my_meal_plan.lunch = document.getElementById("cb_lunch").checked;
            my_meal_plan.dinner = document.getElementById("cb_dinner").checked;

            document.getElementById("mealResult").innerHTML = JSON.stringify(my_meal_plan);
        }

        // Part 8 Function
        function updateMeal() {
            var cuisineValue = document.getElementById("cuisine").value;
            var beverageValue = document.getElementById("beverage").value;

            my_meal_plan["cuisine"] = cuisineValue;
            my_meal_plan["beverage"] = beverageValue;

            document.getElementById("mealResult").innerHTML = JSON.stringify(my_meal_plan);
        }
    </script>

</body>
</html>
